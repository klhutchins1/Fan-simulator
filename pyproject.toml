[project]
name = "fansim"
version = "0.1.0"
description = "Physics-based parametric fan-blade simulator and multi-objective optimizer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "cadquery>=2.4",
    # Cockpit + optimizer are the default UX — no --extra flags needed for
    # `uv run python scripts/cockpit.py` / `uv run python scripts/run_optimization.py`.
    "optuna>=3.6",
    "matplotlib>=3.8",
    "pyvista>=0.44,<0.49",
    "trame>=3.6,<4",
    "trame-vtk>=2.6,<3",
    "trame-vuetify>=2.7",
    "trame-plotly>=3.1",
    "plotly>=5.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rtree>=1.4.1",
]

[project.optional-dependencies]
# Kept so older `uv run --extra viz --extra optim …` commands still resolve.
optim = ["optuna>=3.6", "matplotlib>=3.8"]
viz = [
    "pyvista>=0.44,<0.49",
    "trame>=3.6,<4",
    "trame-vtk>=2.6,<3",
    "trame-vuetify>=2.7",
    "trame-plotly>=3.1",
    "plotly>=5.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
surrogate = ["scikit-learn>=1.4"]
propulsion = ["setuav-pythrust==0.2.3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
neuralfoil = [
    "neuralfoil>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fansim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "docker: requires the OpenFOAM Docker image / trimesh STL round-trip",
    "slow: slow geometry build (featured impellers)",
    "propulsion: requires optional setuav-pythrust (uv sync --extra propulsion)",
]
filterwarnings = [
    # VTK/NumPy 2.x: PyVista <0.49 still assigns to result.shape (roadmap §13.20).
    "ignore:.*shape.*:DeprecationWarning:vtkmodules",
    "ignore:.*shape.*:DeprecationWarning:pyvista",
]

[tool.coverage.run]
source = ["fansim"]
branch = false

[tool.coverage.report]
fail_under = 0
show_missing = true
# Critical modules for absolute CFM (roadmap §13.8) — raise fail_under once baseline is green.
omit = ["fansim/cockpit/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
follow_imports = "skip"
# Stage 1 (§13.19): public CFM surface only. Expand later.
# follow_imports=skip avoids CadQuery→casadi stubs that crash mypy (duplicate INOUT).
files = [
    "fansim/fan_spec.py",
    "fansim/optimize/search_space.py",
    "fansim/cfd/metrics.py",
]
