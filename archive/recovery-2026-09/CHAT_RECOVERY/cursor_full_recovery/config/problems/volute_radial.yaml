# Volute / 90° radial blower — sealed enclosure + radial MRF CFD.
name: volute_radial
archetype: volute
regime: incompressible-RANS-volute
search_space: open

operating_points:
  - {name: free, back_pressure_pa: 0.0}
  - {name: load, back_pressure_pa: 50.0}

objectives:
  - {name: cfm_free,   direction: maximize}
  - {name: cfm_load,   direction: maximize}
  - {name: efficiency, direction: maximize}

constraints:
  max_od_mm: 160
  max_depth_mm: 40
  material: PETG

notes: >
  Radial impeller + sealed Archimedean volute fill with filleted tongue cutwater.
  Dense polyline scroll (n_volute_seg default 96). Evaluate uses radial MRF
  (+Z inlet, +X outlet). Honesty: stage3_smooth_scroll. Export via
  scripts/export_volute.py; score via scripts/evaluate_volute.py.
