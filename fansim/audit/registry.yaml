# Audited physics units. Schema + states: docs/superpowers/specs/2026-09-24-physics-audit-design.md
# targets: "pkg.module" (whole module) or "pkg.module:Name[.method]". Fingerprints ignore comments,
# docstrings and formatting, so only logic changes invalidate a unit.
exempt: []
units:
  - id: physics.air_properties
    targets: ["fansim.physics.air"]
    claim: "Room-temperature sea-level air: rho 1.2 (AMCA) / 1.225 (ISA), nu 1.5e-5, mu 1.81e-5, c0 343"
    source: {kind: standard, ref: "AMCA 210 standard air; ISA sea level; ideal gas + Sutherland"}
    regime: {fluid: air, T_K: [288, 298], p_Pa: 101325}
    checks: [tests/audit/test_air_properties.py]

  - id: audit.direction_geometry
    targets: ["fansim.audit.direction", "fansim.audit.synthetic", "fansim.geometry.rotate"]
    claim: "Designed rotation = the way the concave (pressure) face points; air leaves along that face normal"
    source: {kind: derivation, ref: "velocity triangles, Dixon & Hall, Fluid Mechanics and Thermodynamics of Turbomachinery, ch. 1/5"}
    checks: [tests/audit/test_direction_geometry.py]
    libs: [trimesh, networkx]

  - id: geometry.stock_handedness
    targets:
      - "fansim.geometry.blade:build_impeller"
      - "fansim.geometry.airfoil"
      - "fansim.geometry.config:load_blade_params"
      - "data:config/problems/a12x25_reference.yaml"
    claim: "Stock recipe rotor is designed for omega_z +1 (CCW from +Z) pumping -Z, real-fan chirality, tips leading"
    source: {kind: derivation, ref: "Audit #1 geometric proof"}
    checks: [tests/audit/test_stock_handedness.py]

  - id: cfd.flow_direction_convention
    targets:
      - "fansim.cfd.domain:TestRig"
      - "fansim.cfd.openfoam_case:build_case"
      - "fansim.cfd.templates:MRF_PROPERTIES"
      - "fansim.cfd.templates:BLOCK_MESH"
      - "fansim.cfd.templates:FIELD_U_PDRIVEN"
      - "fansim.cfd.templates:FIELD_P_PDRIVEN"
      - "fansim.cfd.templates:TOPOSET"
      - "fansim.cfd.templates:FIELD_U"
      - "fansim.cfd.templates:FIELD_P"
      - "fansim.audit.direction_verdict"
      - "fansim.validation.reference_stl:rig_for_reference_stl"
      - "fansim.cfd.orientation"
      - "fansim.cfd.openfoam_case:check_placement"
    claim: "Duct inlet -Z / outlet +Z; MRF omega = spin*|omega| about +Z (right-hand); the solved fan pumps +Z in its designed rotation"
    source: {kind: derivation, ref: "Audit #1 (geometry proof + CFD matrix)"}
    checks: [tests/audit/test_cfd_direction_contract.py, "ref:a12x25_direction_matrix", tests/test_cfd_orientation.py, tests/test_cfd_placement_check.py]
    depends_on: [audit.direction_geometry, geometry.stock_handedness, optimize.search_space_handedness]
    libs: [openfoam]

  - id: cfd.cfm_from_outlet_flow
    targets: ["fansim.cfd.metrics:parse_fan_metrics", "fansim.cfd.metrics:CFM_PER_M3S", "fansim.cfd.templates:CONTROL_DICT", "fansim.cfd.metrics:convergence", "fansim.cfd.metrics:oscillation_pct"]
    claim: "CFM = sum(phi) over the +Z outlet patch * 2118.882; positive = delivery toward +Z; never abs()"
    source: {kind: standard, ref: "unit conversion; AMCA 210 flow sign"}
    checks: [tests/audit/test_cfd_direction_contract.py, tests/test_math_consistency.py, tests/test_convergence_rule.py]
    depends_on: [cfd.flow_direction_convention, physics.air_properties]

  - id: optimize.reject_dead_designs
    targets: ["fansim.optimize.system_curve:score_operating_point"]
    claim: "Zero/negative free delivery is rejected (SystemCurveError), never scored"
    source: {kind: derivation, ref: "a fan that does not deliver has no operating point"}
    checks: [tests/audit/test_dead_design_guard.py]

  - id: propeller.thrust_sign
    targets:
      - "fansim.propeller.calibrate:normalize_metrics_sign"
      - "fansim.propeller.direction"
      - "fansim.propeller.optimize"
    claim: "Prop thrust sign comes from the geometry-derived rotation, not from flipping spin until thrust > 0"
    source: {kind: derivation, ref: "Audit #1"}
    checks:
      - tests/audit/test_prop_thrust_sign.py
      - tests/audit/test_prop_builder_direction.py
      - tests/audit/test_prop_search_space_handedness.py
    depends_on: [cfd.flow_direction_convention, geometry.stock_handedness]

  - id: optimize.search_space_handedness
    targets: ["fansim.optimize.search_space"]
    claim: "Optimizer bounds keep stagger > 0 and camber >= 0, so every axial design has Stock handedness"
    source: {kind: derivation, ref: "Audit #1: fixed CFD orientation is valid only without mirrored designs"}
    checks: [tests/audit/test_search_space_handedness.py]

  - id: cfd.sanity_checks
    targets: ["fansim.cfd.sanity"]
    claim: "Cheap physics/setup invariants on every fan CFD result"
    source: {kind: derivation, ref: "mass/energy conservation; Euler turbomachinery power sign; AMCA inlet bookkeeping"}
    checks: [tests/test_cfd_sanity.py]

  - id: propeller.bemt
    targets:
      - "fansim.propeller.bemt:analyze"
      - "fansim.propeller.bemt:_section_aero"
      - "fansim.propeller.bemt:_compressibility_cl_cd"
      - "fansim.propeller.bemt_catalog"
    claim: "Prop BEMT (Prandtl tip loss, swirl, Re-aware polars, Prandtl-Glauert) gives static C_T/C_P near measured UIUC data and never beats momentum theory"
    source: {kind: datasheet, ref: "UIUC Propeller Data Site (Selig) APC SF 9x4.7 static row; Glauert/Prandtl blade-element momentum theory"}
    checks: [tests/audit/test_prop_bemt_audit.py, tests/test_bemt.py, tests/test_bemt_catalog.py]
    depends_on: [physics.air_properties]
