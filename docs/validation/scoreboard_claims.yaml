# Validation scoreboard (RV-2): every published-data comparison the release can claim.
#
# One row per quantity. `ours.kind`:
#   live      recomputed by fansim/validation/scoreboard.py on every test run (cheap: BEMT vs UIUC)
#   data      read from a committed result file and recomputed from it
#   recorded  only a number in a markdown report; no committed result file. `where` is file#Lline
#             and `where_text` must appear on that line.
# `tolerance` is the rule decided BEFORE the data, with the file that fixed it. null = none was
# pre-registered, so the row is reported but NOT JUDGED.
# `recorded_verdict` is what the audit concluded. For live/data rows the test fails if the
# recomputed verdict differs from it, so a code or data change that flips a claim fails CI.
#
# Do not edit numbers to make a row pass. A changed verdict needs its own audit file.

claims:
  - id: a12x25.free_air
    surface: Fan CFD (axial)
    quantity: free-air flow, close-reference A12x25 STL, CFD v5 (ring + frame + layers)
    published: {value: 60.1, unit: CFM, source: "Noctua NF-A12x25 datasheet"}
    ours: {kind: recorded, value: 59.8, where: "docs/validation/audits/2026-09-28-audit-02-cfd-method-validation.md#L56", where_text: "59.8"}
    tolerance: {rel: 0.10, source: "docs/roadmap.md (section 10 interim band, set 2026-09-14, before audit-02)"}
    recorded_verdict: PASS

  - id: a12x25.shutoff
