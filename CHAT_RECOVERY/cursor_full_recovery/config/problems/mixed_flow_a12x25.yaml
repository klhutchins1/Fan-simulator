# Problem definition: mixed-flow impeller in the A12x25 through-flow envelope.
# Not a volute / squirrel-cage. Geometry: fansim.centrifugal. CFD: scripts/validate_stl.py.
name: A12x25 mixed-flow
archetype: centrifugal
regime: incompressible-RANS-MRF
search_space: open

operating_points:
  - {name: free, back_pressure_pa: 0.0}
  - {name: load, back_pressure_pa: 1.0}

objectives:
  - {name: cfm_free,   direction: maximize}
  - {name: cfm_load,   direction: maximize}
  - {name: efficiency, direction: maximize}

constraints:
  envelope_dia_mm: 119.0
  envelope_depth_mm: 25.0
  material: PETG
  min_sol_mid: null
  min_sol_tip: null

notes: >
  Mixed-flow drop-in for the measured A12x25 cup + 110 mm frame + 25 mm depth.
  Hub is a cone (eye 16 mm → back 28 mm); blades loft eye→tip. Not a radial blower
  and not proof mixed-flow beats axial at 20 Pa until a validate_stl campaign exists.
