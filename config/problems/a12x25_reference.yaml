# Provenance: reference-parametric — cylinder-sliced eye-fit to validation/reference/a12x25_impeller.stl
# (NOT OEM CAD). Cockpit Stock / gold ✕ loads this via stock_blade_flat("a12x25").
# tip_radius / hub_height frame+mount fitted (110 mm ID − 0.5 mm gap; min hub height 15 mm).
# Published targets (docs/a12x25-reference.md): 60.1 CFM, 22.9 Pa, 22.6 dB(A), 2000 RPM, 0.5 mm tip.
# Prior wide-chord recipe: config/problems/a12x25_approx.yaml.
#
# 2026-09-15 STL slice fit (9-blade median at cylinder stations):
#   root≈r27: chord~18 wall~2.6 stag~38
#   mid≈r37:  chord~23 wall~2.7 stag~30
#   tip≈r53:  chord~33 wall~2.8 stag~21; mid→tip wrap ~19° (~18 mm arc)
# Wrap is carried by lean_deg only — large tip skew + cylindrical_tip clipped the tip
# chord (rho=sqrt(r^2+t^2) with t+=skew). section_family=plate for bullnose wall.
# Hub 22 mm + blade_hub_z 4.5 mm: roots sit toward the intake face (ref STL mean root Z
# was ~+5 mm on a ~17 mm hub; stock was centered and looked glued to the bottom).
n_blades: 9
hub_radius: 21.5
tip_radius: 54.5
hub_height_mm: 22.0
blade_hub_z_mm: 4.5
root_embed: 2.0
hub_axial_margin: 1.5
rpm: 2000.0
n_span: 18
n_chord: 60
section_family: plate
stations:
  # thickness = wall_mm / chord (uniform ~2.7 mm)
  - {r_frac: 0.0, chord: 18.0, stagger_deg: 38.0, thickness: 0.150, max_camber: 0.05, camber_pos: 0.4, sweep: 0.0, skew: 0.0, lean_deg: 0.0}
  - {r_frac: 0.5, chord: 24.0, stagger_deg: 30.0, thickness: 0.112, max_camber: 0.06, camber_pos: 0.4, sweep: 0.0, skew: 0.0, lean_deg: 14.0}
  - {r_frac: 1.0, chord: 35.0, stagger_deg: 20.5, thickness: 0.077, max_camber: 0.06, camber_pos: 0.4, sweep: 0.0, skew: 0.0, lean_deg: 33.0}
