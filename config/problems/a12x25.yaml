# Provenance: approximate — legacy path config/problems/a12x25.yaml (not OEM CAD).
# Prefer stock_blade_flat("a12x25") for cockpit Stock (loads a12x25_reference.yaml).
# Approximate Noctua NF-A12x25 geometry for CFD VALIDATION (not the exact Noctua profile).
# 9 swept blades, ~113 mm impeller / ~43 mm hub, high-solidity pressure-oriented design.
# Target published specs (docs/a12x25-reference.md): free-air 60.1 CFM, shut-off 22.9 Pa,
# 22.6 dB(A), 2000 RPM, 0.5 mm tip clearance.
# NOTE: this is a parametric approximation; preferred CFD mesh is validation/reference/a12x25_impeller.stl.
n_blades: 9
hub_radius: 21.5
tip_radius: 56.5
root_embed: 2.0
hub_axial_margin: 1.5
rpm: 2000.0
n_span: 18
n_chord: 60
# Wide, circumferentially-wrapped (lean_deg increasing to tip) blades so they sweep and
# approach the A12x25's high-solidity overlapping look.
# Legacy recipe: station chord is the LOFT chord (pre-37728b9); the cylindrical trim shortens the tip.
chord_basis: loft
stations:
  - {r_frac: 0.0, chord: 34.0, stagger_deg: 26.0, thickness: 0.08, max_camber: 0.05, camber_pos: 0.4, sweep: 0.0, skew: 0.0, lean_deg: 0.0}
  - {r_frac: 0.5, chord: 44.0, stagger_deg: 26.0, thickness: 0.05, max_camber: 0.06, camber_pos: 0.4, sweep: 3.0, skew: 0.0, lean_deg: 14.0}
  - {r_frac: 1.0, chord: 38.0, stagger_deg: 22.0, thickness: 0.03, max_camber: 0.06, camber_pos: 0.4, sweep: 5.0, skew: 0.0, lean_deg: 26.0}
